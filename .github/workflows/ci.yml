name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: pip install -r requirements-dev.txt -r requirements-admin.txt
      - run: ruff check .
      - run: python -m pytest -q

      # Se un passo fallisce: avviso diretto all'admin sul bot approvazioni (issue #3). Con curl e non con
      # Python, cosi' funziona anche quando e' l'installazione a rompersi. Nessun effetto se il job
      # riesce o viene annullato, o se il bot non e' configurato.
      - name: Avviso di errore su Telegram
        if: failure() && github.ref == 'refs/heads/main'
        env:
          TG_TOKEN: ${{ secrets.PROMO_APPROVAL_BOT_TOKEN }}
          TG_CHAT: ${{ vars.PROMO_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: "CI"
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || exit 0
          text=$(printf '❌ <b>Promo · %s fallito</b>\n<a href="%s">Apri la run</a>' "$WHAT" "$RUN_URL")
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" \
            -d parse_mode=HTML -d disable_web_page_preview=true || true

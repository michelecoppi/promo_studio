[project]
name = "promo-studio"
version = "0.1.0"
description = "Promo Studio per Guess the Player from the Path: video e post promozionali, coda di approvazione, pubblicazione e report."
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: genera un video vero con ffmpeg (piu' lento)"]
